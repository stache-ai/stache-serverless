name: Create Cognito User

on:
  workflow_dispatch:
    inputs:
      resource_prefix:
        description: 'Resource prefix (default: stache)'
        required: false
        type: string
        default: 'stache'
      email:
        description: 'Email address for the new user'
        required: true
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  create-user:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create user
        id: create
        run: |
          # Capture output to parse password
          OUTPUT=$(./scripts/create-user.sh --prefix "${{ inputs.resource_prefix }}" "${{ inputs.email }}" 2>&1)
          echo "$OUTPUT"

          # Extract password for summary (only if generated)
          PASSWORD=$(echo "$OUTPUT" | grep "^Password:" | cut -d' ' -f2-)
          if [ -n "$PASSWORD" ] && [ "$PASSWORD" != "(as provided)" ]; then
            echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          fi

      - name: Get stack outputs
        id: outputs
        run: |
          STACK_NAME="${{ inputs.resource_prefix }}-serverless"
          FRONTEND_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendUrl`].OutputValue' \
            --output text)
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## User Created ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Email:** ${{ inputs.email }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.create.outputs.password }}" ]; then
            echo "**Password:** \`${{ steps.create.outputs.password }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Save this password - it won't be shown again!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Login at:** ${{ steps.outputs.outputs.frontend_url }}" >> $GITHUB_STEP_SUMMARY
